<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Internal-visitor opt-out: runs BEFORE GA loads so the disable flag is set in time.
         Activate by visiting ?internal=true once; deactivate by visiting ?internal=false. -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var ip = params.get('internal');
          if (ip === 'true') localStorage.setItem('xma_internal_visitor', 'true');
          if (ip === 'false') localStorage.removeItem('xma_internal_visitor');
          if (localStorage.getItem('xma_internal_visitor') === 'true') {
            window['ga-disable-G-QHEDYQZCQD'] = true;
            console.log('[XMA] Internal visitor mode — analytics disabled');
          }
        } catch (e) { /* localStorage blocked — ignore */ }
      })();
    </script>
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QHEDYQZCQD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QHEDYQZCQD');
    </script>
    <link rel="icon" type="image/png" href="/xhoja-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title is the only base SEO tag — prerender REPLACES it on every prerendered
         route (so this fallback shows only on utility routes like /payment-success).
         No <meta name="description"> here on purpose: the prerender plugin APPENDS rather
         than replaces meta tags, so a static description would create a duplicate that
         Google reads BEFORE the per-page description, defeating route-specific SEO. -->
    <title>Xhoja Music Agency | Live Music for Events in Boston & Los Angeles</title>
    <!-- Globally-applied OG/Twitter tags (image + card type + site identity). Per-page
         og:title, og:description, og:url are injected by the prerender script. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.xhojamusicagency.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Xhoja Music Agency — live music for events in Boston and Los Angeles" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.xhojamusicagency.com/og-image.jpg" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://www.xhojamusicagency.com",
      "name": "Xhoja Music Agency",
      "alternateName": "XMA",
      "url": "https://www.xhojamusicagency.com",
      "logo": "https://www.xhojamusicagency.com/xhoja-logo.png",
      "image": "https://www.xhojamusicagency.com/xhoja-logo.png",
      "description": "Xhoja Music Agency books vetted professional musicians — solo pianists, jazz trios, string quartets, and DJs — for weddings, private events, corporate functions, and hospitality across Greater Boston and Los Angeles.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Boston",
        "addressRegion": "MA",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "42.3601",
        "longitude": "-71.0589"
      },
      "telephone": "+18574988487",
      "email": "xhojamusicagency@gmail.com",
      "priceRange": "$$-$$$$",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "10:00",
          "closes": "16:00"
        }
      ],
      "founder": {
        "@type": "Person",
        "name": "Alexander Xhoja",
        "jobTitle": "Artistic Director & CEO"
      },
      "sameAs": [
        "https://instagram.com/xhojamusicagency"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Live Music Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Wedding Music",
              "description": "Live music for ceremonies, cocktail hours, and receptions — solo piano, string quartets, jazz trios, and DJs."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Corporate & Private Events",
              "description": "Vetted musicians for corporate galas, donor dinners, private celebrations, and milestone events."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Hospitality & Recurring Programs",
              "description": "Hotel and restaurant residencies, senior-living programming, and church and memorial services."
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- vite-prerender-plugin discovers the prerender() export from this script
         at build time only. The `prerender` attribute strips it from the final
         client HTML so it never executes in browsers. -->
    <script type="module" src="/src/prerender.tsx" prerender></script>
  </body>
</html>
